name: Build v8_reader_wx (Windows + Linux)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Clone zlib if not present
      run: |
        if (-not (Test-Path "3rdparty/zlib/CMakeLists.txt")) {
          Remove-Item -Recurse -Force "3rdparty/zlib" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "3rdparty/zlib" | Out-Null
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git tmp_zlib
          Copy-Item -Path "tmp_zlib/*" -Destination "3rdparty/zlib/" -Recurse
          Remove-Item -Recurse -Force "tmp_zlib"
        }
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Install wxWidgets via vcpkg
      run: |
        # vcpkg уже установлен на GitHub Actions windows-latest
        vcpkg install wxwidgets:x64-windows
        
    - name: Configure CMake
      run: |
        cmake -B build `
          -S . `
          -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DV8_READER_BUILD_GUI=ON `
          -DV8_READER_BUILD_CLI=OFF `
          -DV8_READER_BUILD_TESTS=OFF `
          -DCMAKE_BUILD_TYPE=Release
        
    - name: Build project
      run: |
        cmake --build build --config Release -j
        
    - name: Verify v8_reader_wx.exe and zlibstatic.lib
      run: |
        Get-ChildItem -Recurse "build" -Filter "*.exe" | Select-Object FullName
        Get-ChildItem -Recurse "build" -Filter "*.lib" | Select-Object FullName
        $exe_found = (Test-Path "build/bin/v8_reader_wx.exe") -or (Test-Path "build/Release/v8_reader_wx.exe")
        $lib_found = (Test-Path "build/lib/zlibstatic.lib") -or (Test-Path "build/zlib_build/Release/zlibstatic.lib") -or (Test-Path "build/Release/zlibstatic.lib")
        
        if ($exe_found -and $lib_found) {
          Write-Host "SUCCESS: v8_reader_wx.exe and zlibstatic.lib created"
          ls build/bin/
          ls build/lib/
        } else {
          if (-not $exe_found) { Write-Error "FAILED: v8_reader_wx.exe not found" }
          if (-not $lib_found) { Write-Error "FAILED: zlibstatic.lib not found" }
          exit 1
        }
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: v8-reader-wx-windows
        path: |
          build/bin/v8_reader_wx.exe
          build/Release/v8_reader_wx.exe
          build/lib/zlibstatic.lib
          build/zlib_build/Release/zlibstatic.lib
          build/Release/zlibstatic.lib
        retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Clone zlib if not present
      run: |
        if [ ! -f "3rdparty/zlib/CMakeLists.txt" ]; then
          rm -rf 3rdparty/zlib
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git 3rdparty/zlib
        fi
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libwxgtk3.2-dev wx-common
        
    - name: Configure CMake
      run: |
        cmake -B build \
          -S . \
          -DV8_READER_BUILD_GUI=ON \
          -DV8_READER_BUILD_CLI=OFF \
          -DV8_READER_BUILD_TESTS=OFF \
          -DCMAKE_BUILD_TYPE=Release
        
    - name: Build project
      run: |
        cmake --build build -j$(nproc)
        
    - name: Verify v8_reader_wx and libz.a
      run: |
        if [ -f "build/bin/v8_reader_wx" ] && [ -f "build/lib/libz.a" ]; then
          echo "SUCCESS: v8_reader_wx and libz.a created"
          ls -la build/bin/
          ls -la build/lib/
        else
          echo "FAILED: v8_reader_wx or libz.a not found"
          exit 1
        fi
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: v8-reader-wx-linux
        path: |
          build/bin/v8_reader_wx
          build/lib/libz.a
        retention-days: 7
